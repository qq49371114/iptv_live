# organize_live.yml v7.5 - 婉儿极速版
# 机器人管家：自动整理直播源 (极速优化版)
# 作者：婉儿 & 哥哥

name: 自动整理直播源

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3,11,19 * * *'
    - cron: '0 */4 * * *'  # ✨ 每4小时运行
  push:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # ✨ 增加到90分钟

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 设置 Python 3.10 + 缓存
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'  # ✨ 启用缓存

      - name: 💾 优化 Python 环境
        run: |
          python -m pip install --upgrade pip --no-cache-dir
          pip install --no-cache-dir aiohttp tqdm

      - name: 📊 运行整理程序
        run: |
          export PYTHONUNBUFFERED=1
          python -u m3u8_organizer.py --config "config.json" --rules-dir "rules" --manual-sources-dir "sources_manual" --generated-sources-dir "sources_generated" --remote-sources-file "sources.txt" -b "config/blacklist.txt" -f "config/favorites.txt" -o "dist/live"

      - name: 🎯 提交更新
        uses: EndBug/add-and-commit@v9
        with:
          token: ${{ secrets.ACTIONS_PAT }}
          add: 'dist/ sources_generated/'
          message: 'chore(bot): 自动更新直播源 (v7.5)'
          rebase: 'true'
          force: 'true'
